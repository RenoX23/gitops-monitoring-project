apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gitops-app-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
  - name: gitops-app.rules
    rules:
    - alert: PodRestartingTooMuch
      expr: increase(kube_pod_container_status_restarts_total{namespace="gitops-app"}[5m]) > 0
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "Pod restarting in gitops-app namespace"
        description: "Pod {{ $labels.pod }} has restarted recently"

    - alert: HighCPUUsage
      expr: sum(rate(container_cpu_usage_seconds_total{namespace="gitops-app"}[2m])) by (pod) > 0.1
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage detected"
        description: "Pod {{ $labels.pod }} CPU usage is above threshold"

    - alert: AppEndpointDown
      expr: up{job="kubernetes-pods", namespace="gitops-app"} == 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "GitOps app endpoint is down"
        description: "Pod {{ $labels.pod }} is not reachable"
